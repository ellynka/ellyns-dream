<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7dfe3">
<link rel="manifest" href="manifest.json">
<title>Ellyn’s dream</title>
<style>
:root{--bg:#fbf0f1;--card:#fffafa;--ink:#49383b;--muted:#927b80;--pink:#d98b9a;--line:#efdfe2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff7f7,#f8e7ea);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
.app{max-width:720px;margin:auto;min-height:100vh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-family:Georgia,serif;font-size:34px;font-weight:400;margin:0}.date{color:var(--muted);font-size:14px;margin-top:5px}
button{border:0;background:none;color:inherit;font:inherit;cursor:pointer}.add{width:48px;height:48px;border-radius:50%;background:var(--pink);color:white;font-size:28px;box-shadow:0 8px 20px #d98b9a44}
.strip{display:flex;gap:7px;margin-bottom:18px}.day{flex:1;text-align:center;padding:9px 3px;border-radius:15px;color:var(--muted)}.day strong{display:block;font-size:17px;color:var(--ink);margin-top:3px}.day.active{background:#fff;box-shadow:0 5px 18px #9e737515;color:var(--pink)}
.task{background:rgba(255,250,250,.88);border:1px solid var(--line);border-radius:20px;padding:15px;margin:10px 0;display:flex;gap:12px;box-shadow:0 6px 20px #9e73750c}.time{width:52px;color:var(--muted);font-size:12px;padding-top:3px}.dot{width:9px;height:9px;background:var(--pink);border-radius:50%;margin-top:6px}.body{flex:1}.title{font-size:17px;font-weight:650}.done .title{text-decoration:line-through;opacity:.5}.note{font-size:14px;color:var(--muted);margin-top:6px;white-space:pre-wrap}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-top:10px}.link{display:inline-block;margin-top:10px;color:#b85f72;font-size:14px}.check{font-size:22px;color:var(--pink)}
.bottom{position:sticky;bottom:0;padding-top:15px;background:linear-gradient(transparent,var(--bg) 25%)}.quick{display:flex;gap:8px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:7px 8px 7px 15px}.quick input{flex:1;border:0;outline:0;font-size:15px;background:transparent}.quick button{background:var(--pink);color:white;border-radius:13px;padding:9px 14px}
.modal{position:fixed;inset:0;background:#4b343855;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:#fff8f8;width:100%;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:22px 18px calc(28px + env(safe-area-inset-bottom));}.sheet h2{font-family:Georgia,serif;font-weight:400;margin:0 0 16px;font-size:27px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff;font:inherit;outline:none}.field textarea{min-height:120px;resize:vertical}.row{display:flex;gap:10px}.row>*{flex:1}.save{width:100%;background:var(--pink);color:white;border-radius:16px;padding:14px;margin-top:10px}.cancel{width:100%;padding:12px;color:var(--muted)}
.nav{display:flex;gap:8px;margin-bottom:14px}.nav button{padding:8px 13px;border-radius:12px;color:var(--muted)}.nav button.active{background:#fff;color:var(--pink)}
.empty{text-align:center;color:var(--muted);padding:60px 20px;font-family:Georgia,serif;font-size:20px}

select{width:100%;box-sizing:border-box;border:1px solid rgba(120,80,90,.14);background:#fffafa;border-radius:14px;padding:12px 14px;font:inherit;color:#49383f;outline:none}
select:focus{border-color:#cda7b3;box-shadow:0 0 0 3px rgba(205,167,179,.15)}

.edit-task{margin-left:auto;border:0;background:rgba(255,255,255,.7);width:36px;height:36px;border-radius:12px;font-size:18px;color:#8d6573;cursor:pointer}
.edit-task:active{transform:scale(.96)}
.modal{position:fixed;inset:0;background:rgba(55,35,42,.28);backdrop-filter:blur(5px);display:none;align-items:flex-end;z-index:9999}
.modal.show{display:flex}
.modal-sheet{width:100%;max-height:88vh;overflow:auto;background:#fffaf9;border-radius:26px 26px 0 0;padding:20px;box-sizing:border-box;box-shadow:0 -12px 40px rgba(80,50,60,.18)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;font-size:20px}
.icon-btn{border:0;background:#f4e8eb;width:36px;height:36px;border-radius:12px;font-size:24px;color:#7d5966}
.edit-actions{display:flex;gap:10px;margin-top:18px}
.edit-actions button{flex:1;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:600}
.primary-btn{background:#c99eac;color:white}
.danger-btn{background:#f4e1e4;color:#9a5360}

.task-actions{margin-left:auto;display:flex;align-items:center;gap:7px}.edit-task{border:0;background:rgba(255,255,255,.75);width:36px;height:36px;border-radius:12px;font-size:18px;color:#8d6573;cursor:pointer}.edit-task:active{transform:scale(.96)}</style>
    <link rel="apple-touch-icon" href="icon-180.png">
</head>
<body>
<div class="app">
<header><div><h1>Ellyn’s dream</h1><div class="date" id="dateLabel"></div></div><button class="add" id="add">＋</button></header>
<div class="nav"><button class="active" id="dayTab">Мой день</button><button id="calTab">Календарь</button></div>
<div class="strip" id="strip"></div>
<main id="list"></main>
<div class="bottom"><div class="quick"><input id="quick" placeholder="✨ Быстро добавить…"><button id="quickAdd">Добавить</button></div></div>
</div>

<div class="modal" id="modal"><div class="sheet">
<h2>Новая задача</h2>
<div class="field"><label>Название</label><input id="title" placeholder="Например: Бассейн"></div>
<div class="row"><div class="field"><label>Дата</label><input id="taskDate" type="date"></div><div class="field"><label>Время</label><input id="taskTime" type="time"></div></div>
<div class="field"><label>Повторять</label>
<select id="repeat">
  <option value="none">Не повторять</option>
  <option value="daily">Каждый день</option>
  <option value="weekly">Каждую неделю</option>
  <option value="weekdays">Каждый будний день (пн–пт)</option>
  <option value="monthly">Каждый месяц</option>
  <option value="yearly">Каждый год</option>
</select>
</div>
<div class="field"><label>Свободный текст</label><textarea id="note" placeholder="Мысли, план, инструкция, всё что захочешь…"></textarea></div>
<div class="field"><label>Ссылка</label><input id="link" type="url" placeholder="https://…"></div>
<div class="field"><label>Картинка</label><input id="image" type="file" accept="image/*"></div>
<button class="save" id="save">Сохранить</button><button class="cancel" id="cancel">Отмена</button>
</div></div>

<script>
const KEY="ellyns-dream-tasks-v1";
const $=id=>document.getElementById(id);
const add=$("add"), cancel=$("cancel"), modal=$("modal"), taskDate=$("taskDate"), taskTime=$("taskTime"), title=$("title"), note=$("note"), link=$("link"), image=$("image"), saveBtn=$("save"), repeat=$("repeat"), quick=$("quick"), quickAdd=$("quickAdd"), dateLabel=$("dateLabel"), strip=$("strip"), list=$("list"), dayTab=$("dayTab"), calTab=$("calTab");
let tasks=JSON.parse(localStorage.getItem(KEY)||"[]");let selected=new Date();let imageData="";
const uid=()=> (window.crypto&&window.crypto.randomUUID)?window.crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const pad=n=>String(n).padStart(2,"0"), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=d=>d.toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(tasks));return true}
  catch(e){console.error(e);alert("Не удалось сохранить запись. Проверь свободное место в Safari.");return false}
}
function dayDiff(a,b){
  const x=new Date(a.getFullYear(),a.getMonth(),a.getDate());
  const y=new Date(b.getFullYear(),b.getMonth(),b.getDate());
  return Math.round((y-x)/86400000);
}
function occursOn(t,d){
  if(!t.date) return false;
  const start=new Date(t.date+"T12:00:00");
  const diff=dayDiff(start,d);
  if(diff<0) return false;
  const rule=t.repeat||"none";
  if(rule==="none") return diff===0;
  if(rule==="daily") return true;
  if(rule==="weekdays") return d.getDay()>=1 && d.getDay()<=5;
  if(rule==="weekly") return diff%7===0;
  if(rule==="monthly") return d.getDate()===start.getDate();
  if(rule==="yearly") return d.getMonth()===start.getMonth() && d.getDate()===start.getDate();
  return false;
}
function render(){
 dateLabel.textContent=fmt(selected).replace(/^./,c=>c.toUpperCase());
 strip.innerHTML="";
 for(let i=-2;i<=2;i++){let d=new Date(selected);d.setDate(d.getDate()+i);let b=document.createElement("button");b.className="day"+(i===0?" active":"");b.innerHTML=`${d.toLocaleDateString("ru-RU",{weekday:"short"}).replace(".","")}<strong>${d.getDate()}</strong>`;b.onclick=()=>{selected=d;render()};strip.appendChild(b)}
 let arr=tasks.filter(t=>occursOn(t, selected)).sort((a,b)=>(a.time||"").localeCompare(b.time||""));
 list.innerHTML=arr.length?arr.map(t=>`<article class="task ${t.done?"done":""}">
 <div class="time">${t.time||""}</div><div class="dot"></div><div class="body"><div class="title">${esc(t.title)}</div>
 ${t.note?`<div class="note">${esc(t.note)}</div>`:""}${t.image?`<img class="photo" src="${t.image}">`:""}
 ${t.link?`<a class="link" href="${safe(t.link)}" target="_blank" rel="noopener">↗ Открыть ссылку</a>`:""}</div>
 <div class="task-actions"><button class="edit-task" type="button" data-edit-task="${t.id}" aria-label="Редактировать">✎</button><button class="check" onclick="toggle('${t.id}')">${t.done?"✓":"○"}</button></div></article>`).join(""):`<div class="empty">Сегодня — для тебя ✨<br><small>Добавь первую задачу</small></div>`;
}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function safe(x){let u=x.trim();if(!/^https?:\/\//i.test(u))u="https://"+u;try{let z=new URL(u);return ["http:","https:"].includes(z.protocol)?z.href:"#"}catch{return "#"}}
function toggle(id){let t=tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function openModal(){modal.classList.add("show");taskDate.value=iso(selected);taskTime.value="";title.value="";note.value="";link.value="";repeat.value="none";image.value="";imageData=""}
add.onclick=openModal;cancel.onclick=()=>modal.classList.remove("show");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("show")}
image.onchange=()=>{let f=image.files[0];if(!f)return;let r=new FileReader();r.onload=()=>imageData=r.result;r.readAsDataURL(f)}
saveBtn.onclick=()=>{
  const taskTitle=title.value.trim();
  if(!taskTitle){alert("Напиши название записи ❤️");title.focus();return}
  const taskDay=taskDate.value||iso(new Date());
  const t={id:uid(),title:taskTitle,date:taskDay,time:taskTime.value||"",repeat:repeat.value||"none",note:note.value||"",link:link.value||"",image:imageData||"",done:false};
  tasks.push(t);
  if(!save()){tasks.pop();return}
  selected=new Date(taskDay+"T12:00:00");
  modal.classList.remove("show");
  render();
}
quickAdd.onclick=()=>{let v=quick.value.trim();if(!v)return;let m=v.match(/(?:^|\s)(\d{1,2}):(\d{2})(?:\s|$)/);let time=m?`${pad(+m[1])}:${m[2]}`:"";if(m)v=v.replace(m[0]," ").trim();tasks.push({id:uid(),title:v,date:iso(selected),time,repeat:"none",note:"",link:"",image:"",done:false});quick.value="";save();render()}
quick.onkeydown=e=>{if(e.key==="Enter")quickAdd.click()}
dayTab.onclick=()=>{dayTab.classList.add("active");calTab.classList.remove("active");render()}
calTab.onclick=()=>{calTab.classList.add("active");dayTab.classList.remove("active");let d=prompt("Выбери дату (ГГГГ-ММ-ДД)",iso(selected));if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d)){selected=new Date(d+"T12:00");render()}}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js?v=6").catch(()=>{});
render();

let editingTaskId=null;
const editModal=$("editModal"), editTitle=$("editTitle"), editDate=$("editDate"),
      editTime=$("editTime"), editRepeat=$("editRepeat"), editNote=$("editNote"),
      editLink=$("editLink"), closeEdit=$("closeEdit"), saveEdit=$("saveEdit"),
      deleteEdit=$("deleteEdit");

function openEditTask(id){
  const t=tasks.find(x=>String(x.id)===String(id));
  if(!t) return;
  editingTaskId=t.id;
  editTitle.value=t.title||"";
  editDate.value=t.date||"";
  editTime.value=t.time||"";
  editRepeat.value=t.repeat||"none";
  editNote.value=t.note||"";
  editLink.value=t.link||"";
  editModal.classList.add("show");
  editModal.setAttribute("aria-hidden","false");
}
function closeEditTask(){
  editingTaskId=null;
  editModal.classList.remove("show");
  editModal.setAttribute("aria-hidden","true");
}
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-edit-task]");
  if(b){ e.preventDefault(); e.stopPropagation(); openEditTask(b.dataset.editTask); }
});
closeEdit.onclick=closeEditTask;
editModal.addEventListener("click", e=>{ if(e.target===editModal) closeEditTask(); });

saveEdit.onclick=()=>{
  const t=tasks.find(x=>String(x.id)===String(editingTaskId));
  if(!t) return;
  const title=editTitle.value.trim();
  if(!title){ alert("Напиши название задачи"); editTitle.focus(); return; }
  t.title=title;
  t.date=editDate.value||t.date||"";
  t.time=editTime.value||"";
  t.repeat=editRepeat.value||"none";
  t.note=editNote.value||"";
  t.link=editLink.value||"";
  save();
  closeEditTask();
  render();
};

deleteEdit.onclick=()=>{
  const t=tasks.find(x=>String(x.id)===String(editingTaskId));
  if(!t) return;
  if(confirm("Удалить эту задачу?")){
    tasks=tasks.filter(x=>String(x.id)!==String(editingTaskId));
    save();
    closeEditTask();
    render();
  }
};

</script>

<div id="editModal" class="modal" aria-hidden="true">
  <div class="modal-sheet">
    <div class="modal-head">
      <strong>Редактировать</strong>
      <button type="button" id="closeEdit" class="icon-btn" aria-label="Закрыть">×</button>
    </div>
    <div class="field"><label>Название</label><input id="editTitle" type="text"></div>
    <div class="field"><label>Дата</label><input id="editDate" type="date"></div>
    <div class="field"><label>Время</label><input id="editTime" type="time"></div>
    <div class="field"><label>Повторять</label>
      <select id="editRepeat">
        <option value="none">Не повторять</option>
        <option value="daily">Каждый день</option>
        <option value="weekly">Каждую неделю</option>
        <option value="weekdays">Каждый будний день (пн–пт)</option>
        <option value="monthly">Каждый месяц</option>
        <option value="yearly">Каждый год</option>
      </select>
    </div>
    <div class="field"><label>Заметка</label><textarea id="editNote" rows="4"></textarea></div>
    <div class="field"><label>Ссылка</label><input id="editLink" type="url" placeholder="https://..."></div>
    <div class="edit-actions">
      <button type="button" id="deleteEdit" class="danger-btn">Удалить</button>
      <button type="button" id="saveEdit" class="primary-btn">Сохранить</button>
    </div>
  </div>
</div>

</body>
</html>
